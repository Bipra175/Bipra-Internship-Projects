<!DOCTYPE html>
<html>
<head>
  <title>Add Product</title>
  <!-- The Bootstrap link is used for page styling and layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">
  <div class="container">
    <!-- The heading for the Add Product page -->
    <h2>Add Product</h2>

    <!-- The form to add a new product to the database -->
    <form method="POST">
      
      <!-- The input field for the product name -->
      <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>

      <!-- The input field for the product price -->
      <div class="mb-3">
        <label>Price</label>
        <input type="number" step="0.01" name="price" class="form-control" required>
      </div>

      <!-- The input field for the product quantity -->
      <div class="mb-3">
        <label>Quantity</label>
        <input type="number" name="quantity" class="form-control" required>
      </div>

      <!-- The Save button adds the product details -->
      <!-- The Back button returns to the product list page -->
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="/" class="btn btn-secondary">Back</a>
    </form>
  </div>
</body>
</html>
