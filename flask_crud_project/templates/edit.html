<!DOCTYPE html>
<html>
<head>
  <title>Edit Product</title>
  <!-- The Bootstrap link is used for styling the form and buttons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">
  <div class="container">
    <!-- The heading for the edit product page -->
    <h2>Edit Product</h2>

    <!-- The form to edit the product details -->
    <form method="POST">
      
      <!-- The input field for the product name -->
      <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
      </div>

      <!-- The input field for the product price -->
      <div class="mb-3">
        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" class="form-control" required>
      </div>

      <!-- The input field for the product quantity -->
      <div class="mb-3">
        <label>Quantity</label>
        <input type="number" name="quantity" value="{{ product.quantity }}" class="form-control" required>
      </div>

      <!-- The Update button saves the edited product details -->
      <!-- The Back button takes the user to the product list page -->
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="/" class="btn btn-secondary">Back</a>
    </form>
  </div>
</body>
</html>
