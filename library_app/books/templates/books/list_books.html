{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Book List</title>
  <link rel="stylesheet" href="{% static 'books/style.css' %}">
</head>
<body>
  <div class="container">
    <h1>All Books</h1>
    <a href="/books/add/"> Add New Book</a>
    <br><br>

    {% if books %}
      <ul>
        {% for book in books %}
          <li>
            <strong>{{ book.title }}</strong> by {{ book.author }} — ${{ book.price }}  
            ({{ book.published_date }})
            |
            <a href="/books/edit/{{ book.id }}/">Edit</a> |
            <a href="/books/delete/{{ book.id }}/"> Delete</a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No books found.</p>
    {% endif %}
  </div>
</body>
</html>
